name: CoverSheetRepro
options:
  bundleIdPrefix: com.maestro.coversheetrepro
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  CoverSheetRepro:
    type: application
    platform: iOS
    sources:
      - CoverSheetRepro
    info:
      path: CoverSheetRepro/Info.plist
      properties:
        CFBundleDisplayName: CoverSheetRepro
        UILaunchScreen:
          UIColorName: ""
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maestro.coversheetrepro
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: NO
